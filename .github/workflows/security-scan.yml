name: Security regression scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  db-security-assertions:
    name: DB security assertions
    runs-on: ubuntu-latest
    # GitHub emails the workflow owner on failure by default (Settings → Notifications).
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Verify SUPABASE_DB_URL secret is set
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "${SUPABASE_DB_URL}" ]; then
            echo "::error::Missing repository secret SUPABASE_DB_URL (Postgres connection string)."
            exit 1
          fi

      - name: Run security assertions
        id: assertions
        env:
          PGCONN: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set +e
          psql "$PGCONN" -v ON_ERROR_STOP=1 -f scripts/security-assertions.sql 2>&1 | tee /tmp/assertions.log
          status=${PIPESTATUS[0]}
          echo "exit_status=$status" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Build regression report
        if: failure() && steps.assertions.outcome == 'failure'
        id: report
        run: |
          SQL_FILE="scripts/security-assertions.sql"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          COMMIT="${GITHUB_SHA}"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Extract regressed internal_ids from the psql log (NOTICE lines).
          ids=$(grep -oE 'REGRESSION [A-Za-z0-9_]+' /tmp/assertions.log | awk '{print $2}' | sort -u)

          {
            echo "## 🔒 Security regression scan failed"
            echo ""
            echo "Commit: \`${COMMIT}\` · [Workflow run](${RUN_URL})"
            echo ""
            if [ -z "$ids" ]; then
              echo "psql exited non-zero but no \`REGRESSION\` notices were captured. See the [workflow log](${RUN_URL})."
            else
              echo "| internal_id | Failing assertion |"
              echo "|---|---|"
              while IFS= read -r id; do
                [ -z "$id" ] && continue
                line=$(grep -n "ASSERT: ${id}\b" "$SQL_FILE" | head -1 | cut -d: -f1)
                if [ -n "$line" ]; then
                  link="${REPO_URL}/blob/${COMMIT}/${SQL_FILE}#L${line}"
                  echo "| \`${id}\` | [${SQL_FILE}:L${line}](${link}) |"
                else
                  echo "| \`${id}\` | (assertion marker not found in ${SQL_FILE}) |"
                fi
              done <<< "$ids"
              echo ""
              echo "<details><summary>Failing assertion messages</summary>"
              echo ""
              echo '```'
              grep -E 'REGRESSION ' /tmp/assertions.log || true
              echo '```'
              echo ""
              echo "</details>"
            fi
          } > /tmp/report.md

          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment regression report on PR
        if: failure() && github.event_name == 'pull_request' && steps.report.outcome == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: security-regression-scan
          recreate: true
          path: /tmp/report.md

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -z "${SLACK_WEBHOOK_URL:-}" ]; then
            echo "::warning::SLACK_WEBHOOK_URL secret not set; skipping Slack notification."
            exit 0
          fi

          SQL_FILE="scripts/security-assertions.sql"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          ids=$(grep -oE 'REGRESSION [A-Za-z0-9_]+' /tmp/assertions.log 2>/dev/null | awk '{print $2}' | sort -u)

          if [ -z "$ids" ]; then
            id_lines="_(none captured — see workflow log)_"
          else
            id_lines=""
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              line=$(grep -n "ASSERT: ${id}\b" "$SQL_FILE" | head -1 | cut -d: -f1)
              if [ -n "$line" ]; then
                link="${REPO_URL}/blob/${COMMIT}/${SQL_FILE}#L${line}"
                id_lines="${id_lines}• \`${id}\` → <${link}|${SQL_FILE}:L${line}>\n"
              else
                id_lines="${id_lines}• \`${id}\` → _(marker not found in ${SQL_FILE})_\n"
              fi
            done <<< "$ids"
          fi

          text=":lock: *Security regression scan failed*\n*Repo:* ${GITHUB_REPOSITORY}\n*Ref:* ${REF} (${EVENT})\n*Commit:* \`${COMMIT}\`\n*Run:* <${RUN_URL}|View workflow run>\n*Regressed internal_ids:*\n${id_lines}"

          payload=$(jq -n --arg t "$text" '{text: $t}')
          curl -sS -X POST -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"

      - name: Open GitHub issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SLACK_CHANNEL_URL: ${{ secrets.SLACK_CHANNEL_URL }}
        run: |
          SQL_FILE="scripts/security-assertions.sql"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          LABEL="security-regression"

          ids=$(grep -oE 'REGRESSION [A-Za-z0-9_]+' /tmp/assertions.log 2>/dev/null | awk '{print $2}' | sort -u)

          # Only open an issue when at least one internal_id actually regressed.
          if [ -z "$ids" ]; then
            echo "No REGRESSION notices captured; skipping GitHub issue."
            exit 0
          fi

          # Ensure label exists (ignore error if it already does).
          gh label create "$LABEL" --color B60205 --description "Automated security assertion regression" 2>/dev/null || true

          {
            echo "A security assertion regressed on \`${REF}\` (${EVENT})."
            echo ""
            echo "- **Commit:** \`${COMMIT}\`"
            echo "- **Workflow run:** ${RUN_URL}"
            if [ -n "${SLACK_CHANNEL_URL:-}" ]; then
              echo "- **Slack channel:** ${SLACK_CHANNEL_URL}"
            else
              echo "- **Slack:** notification posted via webhook (set \`SLACK_CHANNEL_URL\` secret to link the channel here)"
            fi
            echo ""
            echo "## Regressed internal_ids"
            echo ""
            echo "| internal_id | Failing assertion |"
            echo "|---|---|"
            while IFS= read -r id; do
              [ -z "$id" ] && continue
              line=$(grep -n "ASSERT: ${id}\b" "$SQL_FILE" | head -1 | cut -d: -f1)
              if [ -n "$line" ]; then
                link="${REPO_URL}/blob/${COMMIT}/${SQL_FILE}#L${line}"
                echo "| \`${id}\` | [${SQL_FILE}:L${line}](${link}) |"
              else
                echo "| \`${id}\` | (marker not found in ${SQL_FILE}) |"
              fi
            done <<< "$ids"
            echo ""
            echo "<details><summary>Raw REGRESSION messages</summary>"
            echo ""
            echo '```'
            grep -E 'REGRESSION ' /tmp/assertions.log || true
            echo '```'
            echo ""
            echo "</details>"
          } > /tmp/issue.md

          TITLE="Security regression: $(echo "$ids" | paste -sd ', ' -)"

          # Reuse an existing open issue for the same regressed set if present; else create.
          existing=$(gh issue list --label "$LABEL" --state open --search "$TITLE in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue.md
            echo "Commented on existing issue #$existing"
          else
            gh issue create --title "$TITLE" --label "$LABEL" --body-file /tmp/issue.md
          fi
