name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Dev build (fails on any Vite planning/runtime error)
        run: bun run build:dev
      - name: Production build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Start dev server
        run: |
          bun run dev > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Server up"; exit 0
            fi
            sleep 2
          done
          echo "Server did not start"; cat server.log; exit 1
      - name: Run SSR smoke tests
        env:
          E2E_URL: http://localhost:8080
        run: bun run test:e2e
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true

  e2e-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Production build
        run: bun run build
      - name: Locate wrangler config
        run: |
          set -euo pipefail
          for path in dist/server/wrangler.json .output/server/wrangler.json .output/public/wrangler.json; do
            if [ -f "$path" ]; then
              echo "Found wrangler config at $path"
              echo "WRANGLER_CONFIG=$path" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "ERROR: No wrangler.json found. Build output:"
          ls -la dist/ 2>/dev/null || true
          ls -la .output/ 2>/dev/null || true
          exit 1
      - name: Start production worker (wrangler)
        run: |
          set -euo pipefail
          bunx wrangler dev --config "$WRANGLER_CONFIG" --port 8181 --ip 127.0.0.1 > wrangler.log 2>&1 &
          echo $! > wrangler.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8181/ > /dev/null; then
              echo "Prod worker up"; exit 0
            fi
            sleep 2
          done
          echo "Prod worker did not start"; cat wrangler.log; exit 1
      - name: Run SSR smoke tests against production build
        env:
          E2E_URL: http://127.0.0.1:8181
        run: bun run test:e2e:prod
      - name: Install Playwright chromium
        run: bunx playwright install --with-deps chromium
      - name: Arabic hydration browser test
        env:
          E2E_URL: http://127.0.0.1:8181
        run: bun run test:e2e:browser
      - name: Arabic SSR smoke (dir="rtl" + translated content)
        run: |
          set -euo pipefail
          curl -sf -H 'cookie: gs_lang=ar' -H 'accept-language: ar' \
            http://127.0.0.1:8181/ -o ar.html
          echo "--- <html> tag ---"
          grep -oE '<html[^>]*>' ar.html | head -1
          grep -qE '<html[^>]*\blang="ar"' ar.html || { echo "missing lang=ar"; exit 1; }
          grep -qE '<html[^>]*\bdir="rtl"'  ar.html || { echo "missing dir=rtl"; exit 1; }
          grep -q 'قوستيشن' ar.html || { echo "missing Arabic brand"; exit 1; }
          grep -q 'من نحن'  ar.html || { echo "missing Arabic nav.about"; exit 1; }
          grep -qE '"unhandled"\s*:\s*true' ar.html && { echo "h3-swallowed error body"; exit 1; } || true
          echo "Arabic SSR OK"
      - name: Stop production worker
        if: always()
        run: kill $(cat wrangler.pid) || true
