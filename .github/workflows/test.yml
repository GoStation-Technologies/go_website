name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Start dev server
        run: |
          bun run dev > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ > /dev/null; then
              echo "Server up"; exit 0
            fi
            sleep 2
          done
          echo "Server did not start"; cat server.log; exit 1
      - name: Run SSR smoke tests
        env:
          E2E_URL: http://localhost:8080
        run: bun run test:e2e
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true
